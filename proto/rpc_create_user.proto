syntax = "proto3";

package pb;

// by default impot mencari di struktur folder,jadi kalau merah tidak apa apa, selagi masih bisa di generate
import "user.proto";

option go_package = "gobank/pb";

message CreateUserRequest{
    string username = 1;
    string full_name = 2;
    string email = 3;
    string password = 4;
}

message CreateUserResponse {
    User user = 1;
}